<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backup Restore - {{ settings.company_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="has-mobile-bottom-nav">
    <div class="ambient-shape"></div>

    <header class="topbar">
        <div class="brand-wrap">
            <strong>{{ settings.company_name }}</strong>
            <span class="muted">Halo, {{ username }}</span>
            <button type="button" class="menu-toggle" data-target="mainMenu" aria-label="Toggle Menu">Menu</button>
        </div>
        <nav class="menu-bar" id="mainMenu">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('backup_page') }}" class="active">Backup Restore</a>
            <a href="{{ url_for('settings_page') }}">Pengaturan</a>
            <a href="{{ url_for('landing_page') }}" target="_blank" rel="noreferrer">Lihat Landing</a>
            <form action="{{ url_for('logout') }}" method="post" class="inline-form">
                <button type="submit" class="mini-link danger">Logout</button>
            </form>
        </nav>
    </header>

    <nav class="bottom-nav" aria-label="Navigasi Mobile">
        <a href="{{ url_for('dashboard') }}"><span class="nav-icon">DB</span><span class="nav-label">Dashboard</span></a>
        <a href="{{ url_for('backup_page') }}" class="active"><span class="nav-icon">BK</span><span class="nav-label">Backup</span></a>
        <a href="{{ url_for('settings_page') }}"><span class="nav-icon">ST</span><span class="nav-label">Pengaturan</span></a>
    </nav>

    <main class="settings-layout">
        <section class="panel settings-panel">
            <h1>Backup & Restore Database</h1>
            <p class="helper">Gunakan menu ini untuk membuat snapshot database, download file backup, dan restore saat dibutuhkan.</p>

            <div class="actions">
                <button type="button" id="createBackupBtn" class="btn ghost">Buat Backup Sekarang</button>
                <button type="button" id="refreshBackupBtn" class="btn ghost">Refresh Daftar Backup</button>
            </div>

            <label for="backupSelect">Pilih File Backup</label>
            <select id="backupSelect"></select>

            <div class="actions">
                <button type="button" id="downloadBackupBtn" class="btn ghost">Download Backup</button>
                <button type="button" id="restoreBackupBtn" class="btn primary">Restore Backup</button>
            </div>

            <p id="backupInfo" class="helper">Belum ada data backup.</p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='nav.js') }}"></script>
    <script src="{{ url_for('static', filename='backup.js') }}"></script>
</body>
</html>
