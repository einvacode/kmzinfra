<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ settings.company_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="ambient-shape"></div>

    <section class="auth-shell">
        <article class="auth-card panel">
            <h1>Login Dashboard</h1>
            <p class="muted">Masuk untuk mengakses menu utama pemetaan infrastruktur.</p>

            {% if error_message %}
                <p class="error-box">{{ error_message }}</p>
            {% endif %}

            <form method="post" action="{{ url_for('login') }}">
                <input type="hidden" name="next" value="{{ next_url }}">

                <label for="username">Username</label>
                <input id="username" name="username" required autofocus>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" required>

                <button type="submit" class="btn primary">Login</button>
            </form>

            <p class="helper"><a href="{{ url_for('landing_page') }}">Kembali ke landing page</a></p>
        </article>
    </section>
</body>
</html>
